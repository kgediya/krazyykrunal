<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- MRBD recognizes this page through the capability metadata. -->
  <meta name="mrbd-web-app-capable" content="yes">
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
  <title>Spatial Wayfinder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /* A dark canvas lets bright navigation cues sit over the real world. */
    body {
      width: 600px;
      height: 600px;
      overflow: hidden;
      background: #000000;
      color: #00f0ff;
      font-family: system-ui, sans-serif;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .nav-compass {
      text-align: center;
      font-family: monospace;
      font-size: 15px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.8);
      padding: 6px;
      border-radius: 6px;
    }
    .turn-box {
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(8, 14, 24, 0.94);
      border: 2px solid #00f0ff;
      border-radius: 16px;
      padding: 20px;
    }
    .arrow { font-size: 48px; line-height: 1; }
    .dist { font-family: monospace; font-size: 36px; font-weight: 800; }
    .desc { font-size: 18px; color: #ffffff; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="nav-compass">E 084° · PROMENADE WAY</div>

  <!-- tabindex makes the primary navigation instruction reachable by Select. -->
  <div class="turn-box" tabindex="0">
    <div class="arrow">➔</div>
    <div>
      <div class="dist">120m</div>
      <div class="desc">Turn Right on Marine Drive</div>
    </div>
  </div>

  <div style="text-align:center;color:#94a3b8;font-family:monospace;font-size:13px;">
    ETA 4 MIN · 1.2 KM REMAINING
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- MRBD capability metadata is part of every discoverable Web App. -->
  <meta name="mrbd-web-app-capable" content="yes">
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
  <title>Vision AI Glance</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /* Keep the canvas fixed and scroll-free for a glanceable display. */
    body {
      width: 600px;
      height: 600px;
      overflow: hidden;
      background: #000000;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .hud-pill {
      font-family: monospace;
      font-size: 13px;
      font-weight: bold;
      color: #00f0ff;
      border: 1px solid #00f0ff;
      padding: 3px 8px;
      border-radius: 4px;
      display: inline-block;
    }
    .hud-reticle {
      border: 1px dashed rgba(0, 240, 255, 0.6);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      position: relative;
      margin: 10px 0;
    }
    .laser {
      height: 2px;
      background: #00f0ff;
      animation: scan 2s infinite ease-in-out;
    }
    .hud-card {
      background: rgba(8, 14, 24, 0.92);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 8px;
      outline: none;
      transition: all 0.15s ease;
    }
    .hud-card:focus, .hud-card.is-focused {
      border-color: #00f0ff;
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.4);
      transform: scale(1.02);
    }
    .hud-card h4 { font-size: 17px; margin-bottom: 4px; }
    .hud-card p { font-size: 13px; color: #cbd5e1; }
    @keyframes scan {
      0% { transform: translateY(0); }
      50% { transform: translateY(12px); }
      100% { transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div>
    <span class="hud-pill">VISION AI PULSE</span>
  </div>

  <div class="hud-reticle">
    <div class="laser"></div>
    <span style="font-family:monospace;font-size:13px;">Target: Marine Drive Promenade</span>
  </div>

  <div>
    <div class="hud-card" tabindex="0" id="card1">
      <h4>🏛️ Gateway of India</h4>
      <p>Built 1924 · Waterfront arch overlooking Arabian Sea.</p>
    </div>
    <div class="hud-card" tabindex="0" id="card2">
      <h4>🥙 Mumbai Vada Pav</h4>
      <p>290 kcal · Spiced potato patty · Fresh green chutney.</p>
    </div>
  </div>

  <script>
    // Start focus on the first result so a pinch has an obvious target.
    document.getElementById('card1').focus();
  </script>
</body>
</html>
